<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Household Calendar Builder</title>
    <link rel="stylesheet" href="src/styles.css" />
    <style id="print-page-settings"></style>
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Household Calendar Builder</h1>
      <nav aria-label="Sections">
        <a href="#editor">Editor</a>
        <a href="#preview">Preview</a>
      </nav>
    </header>

    <main class="app-main">
      <section id="editor" class="pane editor" aria-labelledby="editor-heading">
        <h2 id="editor-heading">Editor</h2>

        <form id="calendar-form" novalidate>
          <h3>Calendar settings</h3>
          <p class="hint">Choose one month or a consecutive range. Each month becomes one calendar page.</p>
          <div id="month-range" class="settings-grid"></div>
          <h3>Household tasks</h3>
          <div id="task-list" class="task-list"></div>
          <button type="button" id="add-task">Add task</button>
        </form>

        <details>
          <summary>Advanced: edit configuration JSON</summary>
          <p class="hint"><label for="config-json">Edit configuration and apply it to update the calendar. Dates use <code>YYYY-MM-DD</code>.</label></p>
          <textarea id="config-json" spellcheck="false" rows="20" aria-describedby="config-status"></textarea>
          <button type="button" id="apply-config">Apply JSON</button>
        </details>
        <div class="actions">
          <button type="button" id="load-example">Load October 2026 example</button>
          <button type="button" id="download-config">Download JSON</button>
        </div>
        <div id="config-status" class="status" role="status" aria-live="polite"></div>
        <ul id="config-errors" class="errors" aria-label="Validation errors"></ul>
      </section>

      <section id="preview" class="pane preview" aria-labelledby="preview-heading">
        <h2 id="preview-heading">Print preview</h2>
        <nav id="preview-navigation" class="preview-navigation" aria-label="Calendar month pages"></nav>
        <p id="preview-warning" class="preview-warning" role="status" hidden></p>
        <div class="actions preview-actions">
          <button type="button" id="print-calendar">Print calendar</button>
          <button type="button" id="download-pdf">Download PDF</button>
        </div>
        <div id="pages" class="pages"></div>
        <div id="print-pages" class="print-pages" aria-hidden="true"></div>
      </section>
    </main>
    <div id="pdf-stage" class="pdf-stage" aria-hidden="true"></div>
  </body>
</html>
